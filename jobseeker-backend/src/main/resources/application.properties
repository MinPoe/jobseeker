spring.application.name=jobseeker-backend

# =============================================================================
# DEFAULT PROPERTIES (Applied to all profiles)
# =============================================================================

# Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Server Configuration
server.port=${SERVER_PORT:8080}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

# Logging Levels
logging.level.com.board.jobseeker=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.hibernate.type=${LOG_LEVEL_HIBERNATE:TRACE}

# database config 
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# =============================================================================
# DEVELOPMENT PROFILE (Localhost)
# =============================================================================
---
spring.config.activate.on-profile=dev

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobseekerdb}

# =============================================================================
# DOCKER PROFILE (Container environment)
# =============================================================================
---
spring.config.activate.on-profile=docker

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/jobseekerdb}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.type=${LOG_LEVEL_HIBERNATE:WARN}

# =============================================================================
# PRODUCTION PROFILE
# =============================================================================
---
spring.config.activate.on-profile=prod

spring.datasource.url=${DATABASE_URL}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect