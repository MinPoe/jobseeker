<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/webpage.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>jobseeker</title>
</head>
<body>
    <div class="webpage-container landing">
        <div class="webpage-header">
            <div class="company-logo">
                <img src="images/char-pikachu.png" id="logo">
                <p class="company-name-text montserrat-font">jobseeker</p>
            </div>
            <div class="account-operations">
                <nav>
                    <ul class="nav-links">
                        <div class="nav-button"><li><a href="login">Login</a></li></div>
                        
                        <div class="nav-button"><li><a href="register">Register</a></li></div>
                    </ul>
                </nav>
            </div>
        </div>


        <div class="webpage-body">
            <div class="search-brand montserrat-font">
                <p>jobseeker</p>
            </div>
            <div class="search-container landing-search">
                <form action="results.html" method="GET">
                    <input type="text" class="search-input inter-font" placeholder="Cari lowongan kerja...">
                </form>

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="32" height ="32" class="search-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                </svg>
            </div>
        </div>

        <div class="footer">
            
        </div>
    </div>
</body>
</html>
